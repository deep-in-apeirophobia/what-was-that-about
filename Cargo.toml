[workspace]
resolver = "2"
members = ["crates/wwta-core", "crates/wwta-cli", "src-tauri"]
default-members = ["crates/wwta-core", "crates/wwta-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
log = "0.4"
whisper-rs = { version = "0.16", default-features = false }
sherpa-onnx = { version = "2.0", default-features = false, features = ["static"] }

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = 3
strip = "debuginfo"

# Native ASR code is unusably slow unoptimized; keep it fast in dev builds too.
[profile.dev.package."*"]
opt-level = 3
