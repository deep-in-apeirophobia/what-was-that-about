[package]
name = "wwta-cli"
description = "Command-line interface for What Was That About (transcribe, convert models, smoke tests)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wwta"
path = "src/main.rs"

[features]
default = ["asr"]
asr = ["wwta-core/asr"]

[dependencies]
wwta-core = { path = "../wwta-core" }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
env_logger = "0.11"
log.workspace = true

# GPU backend for whisper.cpp: Metal on macOS, Vulkan elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
wwta-core = { path = "../wwta-core", features = ["metal"] }
[target.'cfg(not(target_os = "macos"))'.dependencies]
wwta-core = { path = "../wwta-core", features = ["vulkan"] }
